# Fly.io deployment for River Spears and the Crews Vault.
#
#   fly auth signup            # or: fly auth login
#   fly launch --no-deploy     # claims the app name, keeps this file
#   fly volumes create vault_data --size 10 --region iad
#   fly secrets set VAULT_SECRET_KEY=... VAULT_PUBLIC_URL=https://<app>.fly.dev
#   fly deploy
#
# The volume is the part that matters: the database, the uploaded audio, the
# album covers and the video loops all live on it. Without one, every deploy
# starts empty.

app = "river-spears-vault"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # Automatic lyric syncing. Uses the "base" model in the cloud (see
    # VAULT_WHISPER_MODEL below) so it fits in 1 GB; set this to "0" to leave
    # the feature out of the image entirely and save ~200 MB.
    WITH_AUTOSYNC = "1"

[env]
  VAULT_DATA_DIR = "/data"
  VAULT_MAX_UPLOAD_MB = "200"
  # Smaller model so lyric syncing fits alongside the app in 1 GB.
  VAULT_WHISPER_MODEL = "base"
  # Keep the downloaded model on the volume; otherwise every restart
  # re-downloads it and the first sync of the day stalls.
  HF_HOME = "/data/models"

[mounts]
  source = "vault_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Never sleep. A shared link should play the moment someone opens it, not
  # after a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB: 512 MB is enough to serve audio, but the lyric-sync model needs
  # room to decode. Roughly $6/month for the machine.
  memory = "1gb"
